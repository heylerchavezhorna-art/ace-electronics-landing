# Publica la landing en el hosting de aceelectronicsperu.com (cPanel) por FTPS
# cada vez que se sube un cambio a main. Los accesos viven en los "secrets"
# del repositorio: FTP_SERVER, FTP_USERNAME y FTP_PASSWORD.
name: Publicar en aceelectronicsperu.com

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      limpiar:
        description: "Borrar TODO lo que haya en public_html antes de subir (solo la primera vez, con copia de seguridad hecha)"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir archivos por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: ${{ inputs.limpiar == true }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            design-system/**
            LOGO/**
            FOTOS/**
            .nojekyll
            **/*.md
            **/*.py
            **/*.psd
